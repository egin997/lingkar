name: remote-database-audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lingkar-phase-1-remote-database-audit
  cancel-in-progress: false

jobs:
  linked-pgtap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_AUDIT_PROJECT_REF: nwiyakbolnumldkrvsim
      SUPABASE_AUDIT_ENVIRONMENT: disposable
      SUPABASE_AUDIT_RESET_ACK: RESET_DISPOSABLE_DATABASE_ONLY
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify Docker runner
        run: docker version
      - name: Verify Supabase CLI and command syntax
        run: |
          npx supabase --version
          npx supabase test db --help
      - name: Link the authorized disposable project
        run: npx supabase link --project-ref "$SUPABASE_AUDIT_PROJECT_REF" --yes
      - name: Verify the linked target guard
        run: npm run db:remote:assert
      - name: Create trusted Phase 1 Auth fixtures
        run: node scripts/phase-1-auth-fixtures.mjs setup
      - name: Run the required linked pgTAP gate
        run: npm run db:remote:test
      - name: Remove trusted Phase 1 Auth fixtures
        if: always()
        run: node scripts/phase-1-auth-fixtures.mjs cleanup
